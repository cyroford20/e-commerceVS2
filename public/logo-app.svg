<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">VapeShop app logo</title>
  <desc id="desc">VapeShop wordmark with a minimal vape device and vapor.</desc>
  <defs>
    <linearGradient id="glow" x1="44" y1="170" x2="212" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4146a"/>
      <stop offset=".55" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#ffb5d0"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="#050505"/>
  <path d="M82 61c-5-17 4-31 17-42M128 56c-3-15 4-28 15-38M169 61c-2-13 5-23 15-31"
    fill="none" stroke="#ffb5d0" stroke-linecap="round" stroke-width="8"/>
  <rect x="76" y="70" width="104" height="104" rx="22" fill="url(#glow)" filter="url(#softGlow)"/>
  <rect x="89" y="83" width="78" height="78" rx="14" fill="#111111"/>
  <path d="M108 99h40v9h-40zM108 120h40v9h-40zM108 141h24v9h-24z" fill="#ffb5d0"/>
  <path d="M76 154h104" stroke="#ffb5d0" stroke-linecap="round" stroke-width="6"/>
  <text x="128" y="216" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">Vape<tspan fill="#ff4d8d">Shop</tspan></text>
</svg>
