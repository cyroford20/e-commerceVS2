<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-labelledby="title desc">
  <title id="title">VapeShop V pod logo</title>
  <desc id="desc">A neon pod vape device with a white V mark.</desc>
  <defs>
    <linearGradient id="pink" x1="20" y1="20" x2="130" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb5d0"/>
      <stop offset=".5" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#d4146a"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="40" fill="#050505"/>
  <path d="M66 39V24c0-9 7-16 16-16s16 7 16 16v15" fill="none" stroke="#fff0f5" stroke-width="8" stroke-linecap="round"/>
  <rect x="39" y="35" width="82" height="101" rx="19" fill="url(#pink)" filter="url(#glow)"/>
  <rect x="49" y="47" width="62" height="76" rx="11" fill="#101010"/>
  <path d="M62 64l15 30 15-30h10L77 108 52 64h10Z" fill="#ffffff"/>
  <circle cx="77" cy="114" r="4" fill="#ff4d8d"/>
  <path d="M39 112h82" stroke="#ffb5d0" stroke-width="4" stroke-linecap="round"/>
  <text x="190" y="101" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1">Vape<tspan fill="#ff4d8d">Shop</tspan></text>
  <text x="194" y="129" fill="#ffb5d0" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="5">POD VAPE</text>
</svg>
