<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">VapeShop logo</title>
  <desc id="desc">A minimal neon pink vape device with vapor.</desc>
  <defs>
    <linearGradient id="glow" x1="20" y1="108" x2="105" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4146a"/>
      <stop offset=".55" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#ffb5d0"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="32" fill="#050505"/>
  <path d="M39 42c-3-9 2-17 9-22M64 39c-2-8 2-15 8-20M86 42c-1-7 3-12 8-16"
    fill="none" stroke="#ffb5d0" stroke-linecap="round" stroke-width="5"/>
  <rect x="37" y="46" width="54" height="54" rx="12" fill="url(#glow)" filter="url(#softGlow)"/>
  <rect x="44" y="53" width="40" height="40" rx="7" fill="#111111"/>
  <path d="M55 61h18v5H55z" fill="#ffb5d0"/>
  <path d="M55 72h18v5H55z" fill="#ff4d8d"/>
  <path d="M55 83h11v5H55z" fill="#d4146a"/>
  <path d="M37 89h54" stroke="#ffb5d0" stroke-linecap="round" stroke-width="3"/>
</svg>
