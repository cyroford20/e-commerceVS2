<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Vape Shop logo</title>
  <desc id="desc">A neon pink vapor flame inside a black rounded square.</desc>
  <defs>
    <linearGradient id="glow" x1="20" y1="108" x2="105" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4146a"/>
      <stop offset=".55" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#ffb5d0"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="32" fill="#050505"/>
  <path d="M22 91h84" stroke="#ff4d8d" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  <path d="M33 88c13-8 13-21 7-31 16 6 22 17 20 28 11-10 15-24 10-42 19 13 27 30 20 45-6 14-22 22-38 18-11-3-18-9-19-18Z" fill="url(#glow)" filter="url(#softGlow)"/>
  <path d="M61 87c-5-8-3-17 5-24 7 8 8 17 3 24" fill="#fff0f5" opacity=".9"/>
  <circle cx="92" cy="31" r="4" fill="#ffb5d0"/>
</svg>
