<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Black Elite Vape Store</title>
  <desc id="desc">A black vape bottle framed by blackberry and strawberry accents with neon violet and cyan smoke.</desc>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ed20ff"/><stop offset=".48" stop-color="#7d42ff"/><stop offset="1" stop-color="#00eaff"/>
    </linearGradient>
    <linearGradient id="bottle" x1=".12" y1="0" x2=".9" y2="1">
      <stop stop-color="#34333b"/><stop offset=".38" stop-color="#111116"/><stop offset="1" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="berry" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff4672"/><stop offset="1" stop-color="#a40048"/>
    </linearGradient>
    <filter id="glow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#030306"/>
  <rect x="9" y="9" width="494" height="494" rx="104" fill="none" stroke="url(#neon)" stroke-width="10" filter="url(#glow)"/>
  <path d="M54 260c30-62 83-47 88-94 4-36-42-52-20-91 19-32 65-24 82 7M458 260c-30-62-83-47-88-94-4-36 42-52 20-91-19-32-65-24-82 7" fill="none" stroke="#ce36ff" stroke-width="18" opacity=".55" filter="url(#soft)"/>
  <path d="M55 270c-17-34 2-56 31-62 28-5 31-25 19-44M457 270c17-34-2-56-31-62-28-5-31-25-19-44" fill="none" stroke="#00dfff" stroke-width="12" opacity=".52" filter="url(#soft)"/>
  <path d="M215 137v-30c0-18 13-31 31-31h20c18 0 31 13 31 31v30" fill="url(#bottle)" stroke="#bfc1cc" stroke-width="6"/>
  <path d="M201 137h110l30 27v21H171v-21z" fill="#17171c" stroke="#898a94" stroke-width="6"/>
  <rect x="144" y="164" width="224" height="273" rx="43" fill="url(#bottle)" stroke="#a6a6b0" stroke-width="6"/>
  <path d="M160 188h192" stroke="url(#neon)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="170" y="211" width="172" height="183" rx="27" fill="#08080c" stroke="#383840" stroke-width="4"/>
  <text x="256" y="315" fill="#fff" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="88" letter-spacing="-8">BE</text>
  <path d="M196 337h120" stroke="url(#neon)" stroke-width="5" stroke-linecap="round"/>
  <text x="256" y="370" fill="#e9e9ef" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">BLACK ELITE</text>
  <path d="M178 407c-17-25-49-32-66-16 4 22 31 35 66 16zm156 0c17-25 49-32 66-16-4 22-31 35-66 16z" fill="#54d744" stroke="#9aff70" stroke-width="4"/>
  <path d="M101 419c-13-8-19-24-11-37 12-18 35-20 47-6 12-14 35-12 47 6 8 13 2 29-11 37l-36 25z" fill="url(#berry)" stroke="#ff9baf" stroke-width="4"/>
  <path d="M343 419c-13-8-19-24-11-37 12-18 35-20 47-6 12-14 35-12 47 6 8 13 2 29-11 37l-36 25z" fill="url(#berry)" stroke="#ff9baf" stroke-width="4"/>
  <g fill="#17101f" stroke="#d4b4ff" stroke-width="3">
    <circle cx="222" cy="425" r="17"/><circle cx="250" cy="418" r="17"/><circle cx="278" cy="425" r="17"/><circle cx="236" cy="448" r="17"/><circle cx="264" cy="448" r="17"/>
  </g>
